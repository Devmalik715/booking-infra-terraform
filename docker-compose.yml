services:
  postgres:
    image: postgres:16-alpine
    container_name: bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookings}
      POSTGRES_USER: ${POSTGRES_USER:-bookings_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrations/002_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - ./db:/work/db:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-bookings_app} -d ${POSTGRES_DB:-bookings} -tAc 'SELECT count(*) FROM hotel_bookings;' | grep -q '[1-9]'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
