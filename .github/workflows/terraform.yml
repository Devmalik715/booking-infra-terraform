name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false


      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -refresh=false \
            -var-file=${{ matrix.environment }}.tfvars \
            -out=tfplan | tee plan.txt
          terraform show -no-color tfplan > plan-full.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            infra/envs/${{ matrix.environment }}/plan.txt
            infra/envs/${{ matrix.environment }}/plan-full.txt
          retention-days: 7

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const path = `infra/envs/${env}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');

            // A GitHub comment tops out at 65536 characters. Keep the tail,
            // which is where the summary line lives, and point at the artifact
            // for the rest.
            const limit = 60000;
            let truncated = false;
            if (plan.length > limit) {
              plan = plan.slice(-limit);
              truncated = true;
            }

            const marker = `<!-- terraform-plan-${env} -->`;
            const body = [
              marker,
              `### Terraform plan - \`${env}\``,
              truncated ? '> Output truncated; the full plan is attached as the `tfplan-' + env + '` artifact.' : '',
              '',
              '```terraform',
              plan,
              '```',
            ].join('\n');

            // Update the existing comment instead of adding one per push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
